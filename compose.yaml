name: foodio-local

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: foodio
      POSTGRES_PASSWORD: foodio-local-only
      POSTGRES_USER: foodio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - foodio-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodio -d foodio"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.10-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - foodio-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - foodio-mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  foodio-mailpit-data:
  foodio-postgres-data:
  foodio-redis-data:
